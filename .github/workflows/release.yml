name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate composer.json
        run: |
          docker run --rm -v "$PWD:/app" -w /app composer:2 composer validate --strict

      - name: Extract changelog for this tag
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Pull the section for this version from CHANGELOG.md
          awk -v ver="$VERSION" '
            /^## v?/ {
              if (found) exit
              if (index($0, ver) > 0) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          name: "v${{ steps.changelog.outputs.version }}"
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}

      - name: Notify Packagist
        if: env.PACKAGIST_TOKEN != ''
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
        run: |
          curl -XPOST -H "content-type:application/json" \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/${{ github.repository }}"}}'
