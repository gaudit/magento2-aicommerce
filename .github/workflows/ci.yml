name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2, phpunit:10
          # phpunit is fetched as a standalone phar — no composer install of
          # magento/* (which would need marketplace auth).

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: PHP syntax lint
        run: |
          find Api Model Controller Console Exception registration.php -name "*.php" \
            -exec php -l -n {} \; 2>&1 | grep -v "No syntax errors" || true
          # Fail if any file shows an error
          ! find Api Model Controller Console Exception registration.php -name "*.php" \
            -exec php -l -n {} \; 2>&1 | grep -q "Parse error\|syntax error"

      - name: PHPUnit (Unit only — Magento not required)
        run: |
          if [ -d Test/Unit ]; then
            phpunit --bootstrap <(cat <<'EOF'
          <?php
          spl_autoload_register(function ($class) {
              if (strpos($class, 'Gaudit\\AiCommerce\\') !== 0) return;
              $rel = str_replace(['Gaudit\\AiCommerce\\', '\\'], ['', '/'], $class) . '.php';
              if (file_exists(__DIR__ . '/' . $rel)) {
                  require __DIR__ . '/' . $rel;
              }
          });
          EOF
          ) Test/Unit
          fi
