name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        # Magento modules conventionally use "*" version constraints; --strict would fail.
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHP CodeSniffer (Magento standard)
        run: vendor/bin/phpcs --standard=Magento2 --extensions=php --ignore=vendor/,Test/ .
        continue-on-error: true # baseline first; tighten over time

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress
        continue-on-error: true

      - name: PHPUnit (Unit)
        run: vendor/bin/phpunit --testsuite=Unit
        if: hashFiles('Test/Unit/**/*.php') != ''
