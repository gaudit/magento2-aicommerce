name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2, phpunit:10
          # phpunit is fetched as a standalone phar — no composer install of
          # magento/* (which would need marketplace auth).

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: PHP syntax lint
        run: |
          set -e
          for f in $(find Api Model Controller Console Exception -name "*.php") registration.php; do
            php -l "$f" > /dev/null
          done
          echo "✓ syntax OK"

      - name: Write standalone PHPUnit bootstrap (no Magento install needed)
        run: |
          cat > .ci-bootstrap.php <<'EOF'
          <?php
          spl_autoload_register(function ($class) {
              if (strpos($class, 'Gaudit\\AiCommerce\\') !== 0) return;
              $rel = str_replace(['Gaudit\\AiCommerce\\', '\\'], ['', '/'], $class) . '.php';
              $path = __DIR__ . '/' . $rel;
              if (file_exists($path)) require $path;
          });
          EOF

      - name: PHPUnit (Unit only)
        run: |
          if [ -d Test/Unit ]; then
            phpunit --bootstrap .ci-bootstrap.php Test/Unit
          else
            echo "No tests; skipping."
          fi
